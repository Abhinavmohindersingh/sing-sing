<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kumi · Grade 3 Pilot Budget v2</title>
<style>
  :root{--ink:#141414;--muted:#5a5a5a;--faint:#8a8a8a;--rule:#cfcfcf;--hair:#e4e4e4;--desk:#e7e8ea;--paper:#fff;--shade:#f5f5f5}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--desk);color:var(--ink);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:10pt;line-height:1.45}
  body{counter-reset:sheet}
  .wrap{padding:24px 16px 80px}
  a{color:inherit}
  .sheet{width:210mm;max-width:100%;min-height:297mm;margin:0 auto 20px;background:var(--paper);box-shadow:0 1px 6px rgba(0,0,0,.18);padding:16mm 17mm 18mm;counter-increment:sheet;position:relative}
  .runhead{display:flex;justify-content:space-between;gap:12px;font-size:7.5pt;color:var(--faint);border-bottom:1px solid var(--hair);padding-bottom:5px;margin-bottom:10mm;letter-spacing:.02em}
  .runhead .pg::after{content:"Page " counter(sheet)}

  header{margin-bottom:8mm}
  .eyebrow{font-size:8pt;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:6px}
  h1{font-size:22pt;line-height:1.15;font-weight:700;margin:0 0 10px;letter-spacing:-.01em}
  .lede{font-size:10.5pt;line-height:1.6;color:#222;max-width:160mm}
  .lede p{margin:0 0 6px}
  .lede ol{margin:2px 0 8px;padding-left:22px}
  .lede li{margin:2px 0}
  .meta{font-size:8.5pt;color:var(--muted);margin-top:10px}

  h2{font-size:14pt;font-weight:700;margin:9mm 0 2mm;padding-bottom:4px;border-bottom:1.5px solid var(--ink);letter-spacing:-.005em}
  .sheet > h2:first-of-type,.runhead + h2{margin-top:0}
  .h2sub{font-size:9.5pt;color:#333;margin:0 0 5mm;line-height:1.55}
  .h2sub p{margin:0 0 2px}
  .h2sub ul{margin:0 0 6px;padding-left:18px}
  .h2sub li{margin:1px 0}

  .summary{display:grid;grid-template-columns:repeat(4,1fr);border-top:1.5px solid var(--ink);border-bottom:1px solid var(--rule);margin:2mm 0 7mm}
  .kpi{padding:9px 10px 10px;border-right:1px solid var(--hair)}
  .kpi:last-child{border-right:0}
  .kpi .k{font-size:7.5pt;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .kpi .v{font-size:15pt;font-weight:700;margin-top:3px}
  .kpi.big .v{font-size:18pt}
  .kpi .s{font-size:8pt;color:var(--muted);margin-top:3px;line-height:1.4}

  .delivers{font-size:10pt}
  .delivers > b{display:block;font-size:12pt;margin-bottom:4px}
  .delivers ul{margin:6px 0 0;padding-left:18px;line-height:1.6}
  .delivers li{margin-bottom:3px}

  .dhero{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #444;margin:6px 0 3mm}
  .dhero > div{padding:8px 10px;border-right:1px solid #c4c4c4}
  .dhero > div:last-child{border-right:0}
  .dhero > div > b{display:block;font-size:15pt;line-height:1.2}
  .dhero > div > span{display:block;font-size:8.3pt;color:var(--muted);line-height:1.35;margin-top:2px}
  .dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm}
  .dgrid > div{border:1px solid #c4c4c4;padding:8px 10px;break-inside:avoid}
  .dgrid > div > b{display:block;font-size:9.5pt;margin-bottom:3px}
  .dgrid > div > span{display:block;font-size:8.6pt;color:#333;line-height:1.45}
  @media (max-width:600px){.dhero,.dgrid{grid-template-columns:1fr 1fr}.dhero > div:nth-child(2){border-right:0}.dhero > div:nth-child(-n+2){border-bottom:1px solid #c4c4c4}}
  .card{margin:0 0 6mm}
  .card-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:1.5px solid var(--ink);padding-bottom:5px;margin-bottom:3mm}
  .card-h .ph{font-size:8pt;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:3px}
  .card-h .t{font-size:15pt;font-weight:700;line-height:1.2}
  .card-h .r{text-align:right;white-space:nowrap}
  .card-h .amt{font-size:15pt;font-weight:700}
  .card-h .wk{font-size:8.5pt;color:var(--muted)}

  table{width:100%;border-collapse:collapse;font-size:9pt}
  th,td{border:1px solid #c4c4c4}
  th:first-child,td:first-child{border-left-color:#444}
  th:last-child,td:last-child{border-right-color:#444}
  table > tr:first-child > *,thead tr:first-child > *,table > tbody:first-child > tr:first-child > *{border-top-color:#444}
  tr:last-child > td{border-bottom-color:#444}
  th{text-align:left;font-size:7.5pt;text-transform:uppercase;letter-spacing:.06em;color:#333;font-weight:700;padding:6px 7px;border-bottom-color:var(--ink);background:var(--shade);vertical-align:bottom}
  td{padding:6px 7px;vertical-align:top}
  th.n,td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  tr:has(+ tr.tot) > td{border-bottom-color:var(--ink)}
  tr.tot td{font-weight:700;background:var(--shade)}
  td.code{color:var(--muted);font-weight:700;width:34px}
  td.role{font-size:8.5pt;color:#333;width:30mm}
  td b{font-weight:700}
  ul.sub{margin:3px 0 0;padding-left:15px;font-size:8.6pt;color:#333;line-height:1.45}
  ul.sub li{margin:1px 0}
  .src{font-size:8pt;color:var(--muted)}
  .opt{font-size:8pt;color:var(--muted);font-style:italic}

  .note{font-size:8.8pt;color:#2a2a2a;line-height:1.55;border-left:2px solid var(--rule);padding:2px 0 2px 10px;margin:4mm 0 0}
  .note b{color:var(--ink)}
  .note table{margin:6px 0 4px;font-size:8.6pt}

  .note.pre{margin:0 0 4mm}
  .note.pre ul{margin:2px 0 6px;padding-left:16px}
  .note.pre ul:last-child{margin-bottom:0}
  .outputs{border:1px solid #444;margin:4mm 0 0;font-size:8.8pt}
  .outputs .oh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--shade);padding:6px 10px;border-bottom:1px solid var(--ink);font-size:7.5pt;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
  .outputs .oh .ms{color:#333}
  .outputs .okpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(32mm,1fr));border-bottom:1px solid #c4c4c4}
  .outputs .okpis > div{padding:7px 10px;border-right:1px solid #e0e0e0}
  .outputs .okpis > div:last-child{border-right:0}
  .outputs .okpis .v{font-size:13pt;font-weight:700;line-height:1.2}
  .outputs .okpis .l{font-size:7.8pt;color:var(--muted);line-height:1.35;margin-top:2px}
  .outputs .ocols{display:grid;grid-template-columns:1fr 1fr}
  .outputs .ocol{padding:8px 10px}
  .outputs .ocol + .ocol{border-left:1px solid #c4c4c4}
  .outputs .oextra{padding:8px 10px;border-top:1px solid #c4c4c4}
  .outputs h4{margin:0 0 4px;font-size:7.5pt;text-transform:uppercase;letter-spacing:.07em}
  .outputs ul{margin:0;padding-left:16px;line-height:1.5}
  .outputs li{margin:1px 0}
  @media (max-width:600px){.outputs .ocols{grid-template-columns:1fr}.outputs .ocol + .ocol{border-left:0;border-top:1px solid #c4c4c4}}
  .gantt{margin:2mm 0 6mm}
  .g-scale,.g-row{display:grid;grid-template-columns:62mm 1fr;align-items:center;gap:8px}
  .g-scale{font-size:7.5pt;color:var(--muted);margin-bottom:4px}
  .g-ticks{display:flex;justify-content:space-between}
  .g-row{font-size:8.6pt;margin:3px 0}
  .g-track{position:relative;height:9px;background:var(--shade);border-radius:2px}
  .g-bar{position:absolute;top:0;height:9px;border-radius:2px;background:#222}
  .g-bar.c{background:#555}.g-bar.t{background:#8a8a8a}.g-bar.p{background:#b5b5b5}

  .total-box table td{font-size:9.5pt;padding:7px 6px}
  .total-box tr:has(+ tr.g) > td{border-bottom:1.5px solid var(--ink)}
  .total-box tr.g td{font-size:12.5pt;font-weight:700;background:var(--shade)}
  .total-box .why{display:block;font-size:8.3pt;color:var(--muted);margin-top:2px}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:8mm}
  .two .card-h .t{font-size:12pt}
  .stack .card-h .t{font-size:12pt}
  .stack .card{margin:0 0 3mm}
  ul.plain{margin:0;padding-left:16px;font-size:9pt;line-height:1.55}
  ul.plain li{margin-bottom:4px}
  footer{font-size:8pt;color:var(--muted);border-top:1px solid var(--hair);padding-top:6px;margin-top:10mm}
  .internal-only{display:none}
  html.show-internal .internal-only{display:block}
  .internal-flag{display:inline-block;font-size:7.5pt;text-transform:uppercase;letter-spacing:.1em;border:1px solid var(--ink);padding:2px 6px;margin-bottom:8px}


  /* tiers: what each tier adds */
  :root{--t1:#1d4ed8;--t1b:#e6eeff;--t2:#15803d;--t2b:#def3e4;--t3:#b45309;--t3b:#fcedd5}
  .h1{background:var(--t1b)} .h2{background:var(--t2b)} .h3{background:var(--t3b)}
  span.h1,span.h2,span.h3{padding:0 2px;border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  li.h1{box-shadow:inset 2px 0 0 var(--t1);padding:0 4px} li.h2{box-shadow:inset 2px 0 0 var(--t2);padding:0 4px} li.h3{box-shadow:inset 2px 0 0 var(--t3);padding:0 4px}
  tr.r1 > td:first-child{box-shadow:inset 3px 0 0 var(--t1)} tr.r2 > td:first-child{box-shadow:inset 3px 0 0 var(--t2)} tr.r3 > td:first-child{box-shadow:inset 3px 0 0 var(--t3)}
  .chip{display:inline-block;margin-top:3px;font-size:6.5pt;font-weight:700;letter-spacing:.04em;color:#fff;padding:1px 4px;border-radius:2px;line-height:1.3;vertical-align:middle}
  .chip.c1{background:var(--t1)} .chip.c2{background:var(--t2)} .chip.c3{background:var(--t3)}
  tr.x td{color:#a3a3a3}
  .xnote{display:block;font-size:8pt;font-style:italic;color:#8a8a8a;margin-top:2px}
  .dgrid > div{position:relative}
  .dgrid > div.b1{border-top:3px solid var(--t1)} .dgrid > div.b2{border-top:3px solid var(--t2)} .dgrid > div.b3{border-top:3px solid var(--t3)}
  .dgrid > div.x{color:#a3a3a3;border-style:dashed}
  .dgrid .chip{position:absolute;top:6px;right:6px;margin:0}
  .dgrid > div.b1 > b,.dgrid > div.b2 > b,.dgrid > div.b3 > b{padding-right:26px}
  .tiername{color:#fff;padding:1px 6px;border-radius:2px;letter-spacing:.08em}
  .tiername.c0{background:#555}
  .tiername.c1{background:var(--t1)} .tiername.c2{background:var(--t2)} .tiername.c3{background:var(--t3)}
  .legend{font-size:8pt;color:var(--muted);margin:-4px 0 10px}
  .legend span{padding:0 5px;border-radius:2px;color:#222;margin-left:2px}
  html.nohl .h1,html.nohl .h2,html.nohl .h3{background:none;box-shadow:none}
  html.nohl .chip,html.nohl .legend,html.nohl tr.x,html.nohl .dgrid > div.x{display:none}
  html.nohl tr.r1 > td:first-child,html.nohl tr.r2 > td:first-child,html.nohl tr.r3 > td:first-child{box-shadow:none}
  html.nohl .dgrid > div{border-top:1px solid #c4c4c4}
  .tierdoc[hidden]{display:none!important}
  .rail{position:fixed;top:24px;left:16px;width:296px;max-height:calc(100vh - 48px);overflow:auto;background:#fff;border:1px solid #444;padding:12px;font-size:9pt;line-height:1.4;z-index:20;box-shadow:0 1px 6px rgba(0,0,0,.15)}
  .rail h3{margin:0 0 8px;font-size:8pt;text-transform:uppercase;letter-spacing:.1em}
  .tierbox{border:1px solid #c4c4c4;margin:0 0 8px;background:#fff}
  .tierbox.on.t0{border:2px solid #555}
  .tierbox.on.t1{border:2px solid var(--t1)} .tierbox.on.t2{border:2px solid var(--t2)} .tierbox.on.t3{border:2px solid var(--t3)}
  .tierbox .pick{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
  .tierbox.core .pick{cursor:pointer}
  .tierbox .sw{width:11px;height:11px;border-radius:2px;flex:none;background:#9a9a9a}
  .tierbox.t1 .sw{background:var(--t1)} .tierbox.t2 .sw{background:var(--t2)} .tierbox.t3 .sw{background:var(--t3)}
  .tierbox .nm{font-weight:700;flex:1}
  .tierbox .pr{font-weight:700;font-variant-numeric:tabular-nums}
  .tierbox .in{font-size:8pt;color:var(--muted)}
  .tierbox details{border-top:1px solid #e4e4e4;padding:5px 10px 8px}
  .tierbox summary{cursor:pointer;font-size:8.3pt;color:#333}
  .tierbox ul{margin:5px 0 0;padding-left:16px;font-size:8.3pt}
  .tierbox ul{list-style:none;padding-left:0}
  .tierbox li{display:flex;align-items:baseline;gap:8px;margin:4px 0}
  .tierbox li > span:first-child{flex:1;position:relative;padding-left:10px}
  .tierbox li > span:first-child::before{content:"•";position:absolute;left:0;color:#777}
  .tierbox .pc{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;color:#333;white-space:nowrap}
  .tierbox summary .pc{float:right;color:#555}
  .calc{border:1px solid #c4c4c4;padding:10px;margin:0 0 8px}
  .calc h3{margin:0 0 6px}
  .calc > summary{list-style:none;cursor:pointer;font-size:8pt;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin:0 0 6px}
  .calc > summary::-webkit-details-marker{display:none}
  .calc > summary::after{content:" ▾"}
  .calc:not([open]) > summary{margin:0}
  .calc:not([open]) > summary::after{content:" ▸"}
  .calc h3 + .row{margin-top:0}
  .calc .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:5px 0}
  .calc .step{display:inline-flex;align-items:center;border:1px solid #c4c4c4;border-radius:3px;overflow:hidden}
  .calc .step button{border:0;background:var(--shade);width:24px;height:24px;font:inherit;font-weight:700;cursor:pointer}
  .calc .step button:hover{background:#e6e6e6}
  .calc .step{flex:none}
  .calc .step b,.calc .step input{min-width:34px;width:44px;text-align:center;font:inherit;font-weight:700;border:0;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
  .calc .step input::-webkit-inner-spin-button{display:none}
  .calc .sub{font-size:8pt;color:var(--muted);text-align:right}
  .calc .tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #444;margin-top:6px;padding-top:6px}
  .calc .tot b{font-size:12pt;font-variant-numeric:tabular-nums}
  .calc .num{font-variant-numeric:tabular-nums}
  .calc .gap{height:8px;border-bottom:1px solid #e4e4e4;margin-bottom:8px}
  .calc .ic{width:14px;height:14px;flex:none;fill:none;stroke:#444;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;margin-right:6px;vertical-align:-2px}
  .calc .lab{display:inline-flex;align-items:center;gap:0;cursor:default}
  .calc label.lab{cursor:pointer}
  .calc label.lab input{margin:0 6px 0 0}
  .calc .addon{display:flex;align-items:flex-start;gap:6px;font-size:8.3pt;margin:3px 0 3px 20px;cursor:pointer}
  .calc .addon input{margin:2px 0 0}
  .calc .seg{display:inline-flex;border:1px solid #c4c4c4;border-radius:3px;overflow:hidden}
  .calc .seg button{border:0;border-left:1px solid #c4c4c4;background:#fff;font:inherit;font-size:8.3pt;padding:3px 7px;cursor:pointer}
  .calc .seg button:first-child{border-left:0}
  .calc .seg button.on{background:#222;color:#fff}
  .calc .sub a{color:inherit}
  .calc .chg{list-style:none;margin:6px 0 0;padding:6px 0 0;border-top:1px solid #e4e4e4;font-size:8.3pt}
  .calc .chg:empty{display:none}
  .calc .chg li{display:flex;justify-content:space-between;gap:8px;margin:2px 0}
  .calc .chg b{font-variant-numeric:tabular-nums;white-space:nowrap}
  .rail label{display:flex;gap:6px;align-items:center;font-size:8.5pt;margin-top:4px;cursor:pointer}
  .rail .rnote{font-size:7.8pt;color:var(--muted);margin:6px 0 0}
  @media (min-width:1300px){.wrap{padding-left:330px}}
  @media (max-width:1299px){.rail{position:static;width:auto;max-width:210mm;max-height:none;margin:16px auto 0;box-shadow:none}}

  /* phones */
  @media (max-width:600px){
    .wrap{padding:10px 8px 80px}
    .sheet{padding:16px 12px}
    h1{font-size:18pt}
    h2{font-size:12.5pt}
    .card-h{flex-wrap:wrap;gap:4px 12px}
    .card-h .t,.card-h .amt{font-size:13pt}
    .kpi .v{font-size:13pt} .kpi.big .v{font-size:15pt}
    .card,.note,.total-box{overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{font-size:8.6pt}
    th,td{padding:5px 6px}
    th,th.n{white-space:normal}
    /* each task becomes a block: code on the left, then title, who, weeks and cost underneath */
    table.tasks,table.tasks tbody,table.tasks tr,table.tasks td{display:block}
    table.tasks thead,table.tasks tr:first-child:has(th){display:none}
    table.tasks{border:1px solid #444}
    table.tasks tr{display:grid;grid-template-columns:38px 1fr;border-bottom:1px solid #c4c4c4}
    table.tasks tr:last-child{border-bottom:0}
    table.tasks td{border:0;text-align:left;white-space:normal}
    table.tasks td.code{grid-row:1 / span 4}
    table.tasks td.role,table.tasks td.wk,table.tasks td.co{grid-column:2;padding-top:0;width:auto}
    table.tasks td.role::before{content:"Who: ";color:var(--muted)}
    table.tasks td.wk::before{content:"Weeks: ";color:var(--muted)}
    table.tasks td.co::before{content:"Cost: ";color:var(--muted)}
    table.tasks tr.tot td:first-child{display:none}
    table.tasks tr.tot td{grid-column:1 / -1}
    table.tasks tr.tot td.wk::before,table.tasks tr.tot td.co::before{content:none}
    table.tasks tr.tot{display:flex;flex-wrap:wrap;gap:0 12px}
    .rail .tiers{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .rail .tierbox{margin:0}
    .rail .tierbox .pick{flex-wrap:wrap;gap:2px 8px;padding:7px 8px}
    .rail .tierbox .pr{width:100%;font-size:10pt}
    .calc{margin-top:8px}
  }
  @media (max-width:820px){.sheet{width:auto;min-height:0;padding:20px 16px}.summary,.two{grid-template-columns:1fr 1fr}.g-scale,.g-row{grid-template-columns:110px 1fr}}

  @page{size:A4;margin:14mm 15mm 16mm;
    @top-left{content:"Kumi · Grade 3 pilot in one school · Investment budget, version 2";font:7.5pt 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#8a8a8a}
    @bottom-right{content:"Page " counter(page) " of " counter(pages);font:7.5pt 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#8a8a8a}}
  @media print{
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    html,body{background:#fff}
    .wrap{padding:0}
    .sheet{width:auto;min-height:0;margin:0;padding:0;box-shadow:none;break-after:page}
    .sheet:last-of-type{break-after:auto}
    .runhead{display:none}
    .rail{display:none}
    .wrap{padding-left:0!important}
    tr,.kpi,.note,.g-row,.outputs{break-inside:avoid}
    .card-h,h2{break-after:avoid}
    a{text-decoration:none}
  }
</style>
</head>
<body>
<div class="wrap">
